# Captures mode: real name resolution, but only through these two public resolvers, which are
# the only DNS destinations cowrie/egress.sh allows (SURYA_EGRESS_DNS). Used by compose.yaml
# when EGRESS_MODE=captures. If you change them here, change SURYA_EGRESS_DNS to match.
nameserver 1.1.1.1
nameserver 9.9.9.9
options timeout:2 attempts:2
