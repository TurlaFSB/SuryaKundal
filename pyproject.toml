[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "surya-kundal"
version = "0.2.0"
description = "SSH honeypot platform: Cowrie sessions, threat-intel enrichment, MITRE ATT&CK mapping, dashboard"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Typing :: Typed",
]

requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "maxminddb>=2.6",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/TurlaFSB/SuryaKundal"
Issues = "https://github.com/TurlaFSB/SuryaKundal/issues"

[project.scripts]
surya-kundal = "surya_kundal.cli:main"

[project.optional-dependencies]
dashboard = [
    "flask>=3.0",
    "waitress>=3.0",
]
evaluation = [
    "paramiko>=3.4",
    "cryptography>=42",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mmdb-writer>=0.1.3",
    "netaddr>=1.0",
    "mypy>=1.10",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "pip-audit>=2.7",
    "pyyaml>=6.0",
    "stix2>=3.0",
    "flask>=3.0",
    "waitress>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"surya_kundal" = ["py.typed"]
"surya_kundal.mapping" = ["rules.toml", "data/*.json"]
"surya_kundal.dashboard" = ["templates/*.html", "static/*"]
"surya_kundal.database" = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=surya_kundal --cov-report=term-missing:skip-covered"
filterwarnings = ["error::ResourceWarning"]

[tool.coverage.run]
source = ["surya_kundal"]
omit = ["*/migrations/*", "*/__main__.py"]

[tool.coverage.report]
fail_under = 90
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["waitress", "waitress.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import order, B: bugbear, UP: modern syntax,
# S: bandit (security), SIM: simplifications, C4: comprehensions, PT: pytest style,
# RUF: ruff-specific checks
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "C4", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert, fake passwords and fake /tmp paths on purpose.
"tests/*" = ["S101", "S106", "S108", "PT018", "RUF005"]
# Egress tests run the repository's own script and system tools with fixed argument lists.
"tests/test_egress.py" = ["S603", "S607"]
"tests/netns_egress_lab.py" = ["S603", "S607"]
# Operator tool run by hand against Cowrie's own bundled fs.pickle: it unpickles that
# trusted file, calls openssl with a fixed argument list, and uses the random module only
# to vary cosmetic details per deployment (not for secrets).
"cowrie/tools/*" = ["S301", "S311", "S603", "S607", "UP031", "E501"]
