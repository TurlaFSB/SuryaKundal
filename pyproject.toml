[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surya-kundal"
version = "0.1.0"
description = "SSH honeypot platform: Cowrie sessions, threat-intel enrichment, MITRE ATT&CK mapping, dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "maxminddb>=2.6",
    "python-dotenv>=1.0",
]

[project.scripts]
surya-kundal = "surya_kundal.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mmdb-writer>=0.1.3",
    "netaddr>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"surya_kundal.mapping" = ["rules.toml", "data/*.json"]
"surya_kundal.database" = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import order, B: bugbear, UP: modern syntax
select = ["E", "W", "F", "I", "B", "UP"]
