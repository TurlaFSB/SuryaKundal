# Surya Kundal: analysis pipeline and dashboard.
#
#   cp .env.example .env && chmod 600 .env     # set DASHBOARD_TOKEN and COWRIE_LOG_DIR
#   docker compose up -d --build
#   open http://127.0.0.1:8080                 # password = DASHBOARD_TOKEN
#
# Cowrie and Wazuh run separately (see cowrie/ and wazuh/); this stack only reads
# Cowrie's JSON log. Every container is unprivileged, has a read-only root filesystem,
# no Linux capabilities, and limits on memory and processes.

x-hardened: &hardened
  image: surya-kundal:local
  init: true  # a tiny init as PID 1 forwards stop signals and reaps child processes
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=64m,mode=1777"]
  pids_limit: 256
  mem_limit: 512m
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  env_file:
    - path: .env
      required: false

services:
  pipeline:
    <<: *hardened
    build: .
    container_name: surya-pipeline
    command: ["run"]
    environment:
      # Fixed paths inside the container; they win over anything in .env.
      DATABASE_URL: sqlite:////data/surya_kundal.db
      GEOIP_DB_DIR: /data/geoip
      TOR_EXIT_LIST_PATH: /data/tor_exit_nodes.txt
      COWRIE_LOG_PATH: /cowrie-log/cowrie.json
    volumes:
      - surya_data:/data
      # Cowrie's log directory, read-only. A directory (not the single file) survives rotation.
      - ${COWRIE_LOG_DIR:?set COWRIE_LOG_DIR in .env, e.g. /home/you/cowrie/var/log/cowrie}:/cowrie-log:ro
    healthcheck:
      test: ["CMD", "surya-kundal", "doctor"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s

  dashboard:
    <<: *hardened
    container_name: surya-dashboard
    command: ["dashboard", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      DATABASE_URL: sqlite:////data/surya_kundal.db
      WAZUH_ALERTS_PATH: /data/wazuh_alerts.jsonl
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:?set DASHBOARD_TOKEN in .env (12+ characters)}
    ports:
      # Local only. To reach it from elsewhere, put a TLS reverse proxy in front.
      - "127.0.0.1:8080:8080"
    volumes:
      # Not :ro on purpose: SQLite's WAL mode needs its -shm file even to read. The app
      # opens the database query_only and has no write routes.
      - surya_data:/data
    depends_on:
      pipeline:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  surya_data:
