# Surya Kundal: analysis pipeline and dashboard.
#
#   cp .env.example .env && chmod 600 .env     # set DASHBOARD_TOKEN and COWRIE_LOG_DIR
#   docker compose up -d --build
#   open http://127.0.0.1:8080                 # password = DASHBOARD_TOKEN
#
# Without a profile this starts the analysis pipeline and dashboard, which read Cowrie's
# JSON log from COWRIE_LOG_DIR (a Cowrie running elsewhere) or, if that is unset, from the
# honeypot container's log volume. To run the honeypot too:
#
#   docker compose --profile honeypot up -d --build
#   ssh -p 2222 root@127.0.0.1                 # COWRIE_BIND defaults to loopback
#
# COWRIE_BIND=0.0.0.0 exposes the honeypot to the network: do that only on a host you
# have prepared for it (see docs/THREAT_MODEL.md) and run cowrie/egress.sh first (docs/EGRESS.md).
# Wazuh runs separately (see wazuh/).
# Every container is unprivileged, has a read-only root filesystem, no Linux capabilities,
# and limits on memory and processes.

x-hardened: &hardened
  image: surya-kundal:local
  init: true  # a tiny init as PID 1 forwards stop signals and reaps child processes
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=64m,mode=1777"]
  pids_limit: 256
  mem_limit: 512m
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  pipeline:
    <<: *hardened
    build: .
    container_name: surya-pipeline
    command: ["run"]
    # Only the pipeline gets .env (API keys for enrichment; it therefore also sees DASHBOARD_TOKEN,
    # which lives in the same file). The honeypot faces the internet and the dashboard needs just
    # its password, so neither receives any other secret.
    # The campaign rebuild is the memory peak, so this is above the other services' limit; a
    # swapfile covers bursts (docs/DEPLOYMENT_AWS.md).
    mem_limit: 640m
    env_file:
      - path: .env
        required: false
    environment:
      # Fixed paths inside the container; they win over anything in .env.
      DATABASE_URL: sqlite:////data/surya_kundal.db
      GEOIP_DB_DIR: /data/geoip
      TOR_EXIT_LIST_PATH: /data/tor_exit_nodes.txt
      COWRIE_LOG_PATH: /cowrie-log/cowrie.json
    volumes:
      - surya_data:/data
      # Cowrie's log directory, read-only. A directory (not the single file) survives rotation.
      # COWRIE_LOG_DIR points at an existing Cowrie; unset, it is the honeypot container's volume.
      - ${COWRIE_LOG_DIR:-cowrie_log}:/cowrie-log:ro
    healthcheck:
      test: ["CMD", "surya-kundal", "doctor"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s

  cowrie:
    <<: *hardened
    profiles: [honeypot]
    image: surya-kundal-cowrie:local
    build:
      context: ./cowrie
    container_name: surya-cowrie
    environment:
      # collect: accepts a few dozen weak root passwords so scanners get in (more data).
      # stealth: three exact pairs only (hardest to spot, very little data).
      COWRIE_POLICY: ${COWRIE_POLICY:-collect}
    # Its own bridge with a fixed name, so the host firewall (cowrie/egress.sh) can limit what
    # the honeypot may open towards the internet, the host and your LAN. See docs/EGRESS.md.
    networks: [honeynet]
    sysctls:
      # Lets the unprivileged honeypot user run its local resolver stub on port 53 (deny mode).
      net.ipv4.ip_unprivileged_port_start: "53"
    ports:
      # Loopback by default so a test run never exposes the honeypot by accident. On a server set
      # COWRIE_BIND=0.0.0.0 and COWRIE_PORT=22 (move the host's own SSH elsewhere first).
      - "${COWRIE_BIND:-127.0.0.1}:${COWRIE_PORT:-2222}:2222"
    volumes:
      # Persona (seed, boot offset), host keys, fake filesystem and downloaded files.
      - cowrie_state:/cowrie
      # Nested over the state volume: the JSON log lives in its own volume so the pipeline
      # can mount it read-only.
      - cowrie_log:/cowrie/var/log/cowrie
      # What the honeypot can resolve. deny (default): a local stub that always fails, so no
      # DNS query leaves. captures: two named public resolvers (set EGRESS_MODE=captures in .env
      # and run `cowrie/egress.sh apply captures`). Docker's built-in resolver is not used,
      # because it forwards queries to the internet on the container's behalf.
      - type: bind
        source: ./cowrie/resolv.${EGRESS_MODE:-deny}.conf
        target: /etc/resolv.conf
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "/opt/kit/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  dashboard:
    <<: *hardened
    container_name: surya-dashboard
    command: ["dashboard", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      DATABASE_URL: sqlite:////data/surya_kundal.db
      WAZUH_ALERTS_PATH: /alerts/wazuh_alerts.jsonl
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:?set DASHBOARD_TOKEN in .env (12+ characters)}
      # Not a secret: show the operator's own (internal) sessions too. See docs/OPERATIONS.md.
      DASHBOARD_SHOW_INTERNAL: ${DASHBOARD_SHOW_INTERNAL:-}
    ports:
      # Local only. To reach it from elsewhere, put a TLS reverse proxy in front.
      - "127.0.0.1:8080:8080"
    volumes:
      # Not :ro on purpose: SQLite's WAL mode needs its -shm file even to read. The app
      # opens the database query_only and has no write routes.
      - surya_data:/data
      # Where wazuh/export-alerts.sh writes (run `mkdir -p data/wazuh` once, as your own user).
      # Read-only; an empty folder just means no alerts panel.
      - ${WAZUH_EXPORT_DIR:-./data/wazuh}:/alerts:ro
    depends_on:
      pipeline:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  honeynet:
    name: surya-honeynet
    driver: bridge
    driver_opts:
      # Must match SURYA_HONEY_BRIDGE in cowrie/egress.sh (an interface name is 15 characters at most).
      com.docker.network.bridge.name: br-suryahoney
      # Deny mode (default): the honeypot's packets leave the host with their private source
      # address, so a cloud network drops them even if the firewall rules are missing for a few
      # seconds after a reboot. captures mode needs real masquerading: set HONEY_MASQUERADE=true.
      com.docker.network.bridge.enable_ip_masquerade: "${HONEY_MASQUERADE:-false}"
    ipam:
      config:
        - subnet: ${HONEY_SUBNET:-172.29.77.0/24}

volumes:
  surya_data:
  cowrie_state:
  cowrie_log:
