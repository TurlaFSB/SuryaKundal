name: Release

# Pushing a tag such as v1.0.0 builds both images, publishes them to GitHub Container Registry,
# signs each one by digest with Sigstore (keyless: the signature proves this workflow built it),
# and attaches a software bill of materials for each image to the GitHub release.
#
#   cosign verify ghcr.io/<owner>/surya-kundal:<version> \
#     --certificate-identity-regexp '^https://github.com/<owner>/SuryaKundal/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    name: Create the GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  images:
    name: Publish and sign ${{ matrix.slug }}
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: surya-kundal
            context: .
          - slug: surya-kundal-cowrie
            context: cowrie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Registry names must be lower case
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804  # v5.7.0
        with:
          images: ghcr.io/${{ env.OWNER }}/${{ matrix.slug }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159  # v3.9.2
      - name: Sign the image by digest
        run: cosign sign --yes "ghcr.io/${OWNER}/${{ matrix.slug }}@${{ steps.build.outputs.digest }}"
      - name: Write the software bill of materials
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          image-ref: ghcr.io/${{ env.OWNER }}/${{ matrix.slug }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: ${{ matrix.slug }}.cdx.json
      - name: Attach the bill of materials to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.slug }}.cdx.json" --clobber
