name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      # Coverage floor and warnings-as-errors for resource leaks live in pyproject.toml.
      - run: pytest -v

  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  package:
    name: Built package works outside the source tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Build the wheel and source distribution
        run: |
          python -m pip install build
          python -m build --outdir dist
          python -m pip install twine && twine check dist/*
      - name: Install it into a clean environment and run it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -c "import importlib.resources as r; assert r.files('surya_kundal').joinpath('py.typed').is_file()"
          cd /tmp
          /tmp/clean/bin/surya-kundal --version
          /tmp/clean/bin/surya-kundal map --db sqlite:////tmp/smoke.db
          /tmp/clean/bin/surya-kundal techniques --db sqlite:////tmp/smoke.db

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pip-audit --skip-editable

  container:
    name: Container builds and runs hardened
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Validate the Compose file
        run: |
          cp .env.example .env
          DASHBOARD_TOKEN=ci-token-0123456789 docker compose --profile honeypot config --quiet
      - name: Build the image
        run: docker build --tag surya-kundal:ci .
      - name: Run it the way Compose does (unprivileged, read-only, no capabilities)
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp surya-kundal:ci --version
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp surya-kundal:ci techniques --db sqlite:////tmp/ci.db
          test "$(docker run --rm --entrypoint id surya-kundal:ci -u)" = "10001"
      - name: Build the honeypot image and check it becomes healthy, hardened
        run: |
          docker build --tag surya-kundal-cowrie:ci cowrie
          docker run -d --name cw --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp --mount type=volume,target=/cowrie surya-kundal-cowrie:ci
          for i in $(seq 1 30); do
            docker exec cw python /opt/kit/healthcheck.py && break
            sleep 2
          done
          docker exec cw python /opt/kit/healthcheck.py
          test "$(docker exec cw id -u)" = "10002"
          docker logs cw 2>&1 | tail -15
